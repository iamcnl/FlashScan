name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - run: pip install -r requirements.txt -r requirements-build.txt
      - run: pyinstaller --noconfirm FlashScan.spec
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/FlashScan.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  FlashScan.exe" | Out-File dist/FlashScan.exe.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: FlashScan-windows
          path: |
            dist/FlashScan.exe
            dist/FlashScan.exe.sha256
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: FlashScan-windows
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            FlashScan.exe
            FlashScan.exe.sha256
          generate_release_notes: true